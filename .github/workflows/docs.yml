name: Validate Docs (Mintlify)

on:
  push:
    branches:
      - main
      - dev
    paths:
      - 'docs/**'
      - '.github/workflows/docs.yml'
  pull_request:
    paths:
      - 'docs/**'
      - '.github/workflows/docs.yml'
  workflow_dispatch:

jobs:
  validate:
    name: mintlify validate
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Validate Mintlify docs, links and contrast
        working-directory: docs
        run: |
          npx -y mint validate
          npx -y mint broken-links --check-redirects
          npx -y mint a11y
