name: CI Supabase (Database)

on:
  pull_request:
    paths:
      - 'supabase/**'
      - 'backend/**'
      - '.github/workflows/supabase-ci.yml'
  push:
    branches:
      - main
    paths:
      - 'supabase/**'

jobs:
  test-database:
    name: Validar Migrations e Schema
    runs-on: ubuntu-latest

    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Iniciar Supabase Local
        run: supabase start

      - name: Verificar erros de lint no banco
        run: supabase db lint

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar dependências do backend
        run: python -m pip install -r backend/requirements-dev.txt

      - name: Executar testes PostgreSQL da importação de planos
        working-directory: backend
        env:
          TEST_SUPABASE_DB_URL: postgresql+psycopg://postgres:postgres@127.0.0.1:14322/postgres
        run: python -m pytest tests/test_plan_import_database.py -q
