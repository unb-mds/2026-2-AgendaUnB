site_name: Agenda UnB Docs
site_description: Documentação oficial do projeto Agenda UnB — Métodos de Desenvolvimento de Software (MDS) 2026/2
repo_name: unb-mds/G8-2026-2
repo_url: https://github.com/unb-mds/2026-2-AgendaUnB

docs_dir: ../docs
site_dir: ../site

# Páginas com estrutura e links próprios do Mintlify.
exclude_docs: |
  /arquitetura/
  /processo/release-notes/
  /processo/uso-de-ia.md
  /produto/

nav:
  - Início: index.md
  - Visão do Produto: documento-de-visao.md
  - Arquitetura: Architecture.md
  - Contratos do Backend: api-specs.md
  - Extração Autorizada S7: processamento-planos-s7.md
  - Validação S7-B01: s7-b01-validacao.md
  - Histórico de Processamento S6: processamento-planos.md
  - Privacidade dos Planos: privacidade-planos.md
  - Plano de Implantação: implantacao.md
  - Modelo de Dados: modelo-de-dados.md
  - Especificação do Banco: especificacao-banco-de-dados.md
  - Requisitos: requisitos.md
  - Padrões de Projeto: padroes.md
  - Interface e Design: especificacao-frontend.md
  - Personas: personas.md
  - Sprints:
    - Sprint 1: sprints/sprint-1.md
    - Sprint 2: sprints/sprint-2.md
    - Sprint 3: sprints/sprint-3.md
    - Sprint 4: sprints/sprint-4.md
    - Sprint 5: sprints/sprint-5.md
    - Sprint 6: sprints/sprint-6.md
    - Sprint 7: sprints/sprint-7.md
    - Sprint 8: sprints/sprint-8.md
  - Release Notes:
    - v0.1.0: release-notes/v0.1.0.md
    - Atualizações pós-Release 1: atualizacoes.md
  - Como Contribuir: CONTRIBUTING.md

theme:
  name: material
  language: pt-BR
  palette:
    # Modo automático conforme sistema operacional
    - media: "(prefers-color-scheme)"
      toggle:
        icon: material/brightness-auto
        name: Modo automático

    # Tema claro
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-7
        name: Mudar para modo escuro

    # Tema escuro
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-4
        name: Mudar para modo claro

  features:
    - navigation.tabs
    - navigation.tabs.sticky
    - navigation.path
    - navigation.top
    - search.suggest
    - search.highlight
    - content.code.copy

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.tasklist:
      custom_checkbox: true
  - tables
