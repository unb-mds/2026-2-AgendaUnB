        modelo-de-dados.md: arquitetura/modelo-de-dados.md
        especificacao-banco-de-dados.md: arquitetura/banco-de-dados.md
        especificacao-frontend.md: arquitetura/frontend.md
        CONTRIBUTING.md: processo/contribuindo.md
        introducao.md: index.md
        quickstart.md: processo/contribuindo.md
        requisitos.md: produto/requisitos.md
        personas.md: produto/personas.md
        padroes.md: produto/padroes.md
        documento-de-visao.md: produto/visao.md
        AI-USAGE.md: processo/uso-de-ia.md
        release-notes/v0.1.0.md: processo/release-notes/v0-1-0.md
        planejamento-r2-sprints-7-8.md: matriz-release-2.md
        prototipo-planos-react.md: planos-de-ensino-frontend.md
        s6-f02-editor-parcial.md: sprints/sprint-6.md

theme:
  name: material
  language: pt-BR
  palette:
    # Modo automático conforme sistema operacional
    - media: "(prefers-color-scheme)"
      toggle:
        icon: material/brightness-auto
        name: Modo automático

    # Tema claro
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-7
        name: Mudar para modo escuro

    # Tema escuro
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-4
        name: Mudar para modo claro

  features:
    - navigation.tabs
    - navigation.tabs.sticky
    - navigation.path
    - navigation.top
    - search.suggest
    - search.highlight
    - content.code.copy

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.tasklist:
      custom_checkbox: true
  - tables
