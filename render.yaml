previews:
  generation: "off"

services:
  - type: web
    name: agenda-unb-api-homolog
    runtime: docker
    plan: free
    branch: main
    rootDir: backend
    dockerfilePath: ./Dockerfile
    dockerContext: .
    autoDeployTrigger: "off"
    healthCheckPath: /health
    envVars:
      - key: APP_ENV
        value: production
      - key: CORS_ORIGINS
        value: https://agendaunb.com.br,https://2026-2-agendaunb-agenda-un-b.vercel.app
      - key: DATABASE_URL
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_ANON_KEY
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: GOOGLE_CALENDAR_CLIENT_ID
        sync: false
      - key: GOOGLE_CALENDAR_CLIENT_SECRET
        sync: false
      - key: GOOGLE_TOKEN_ENCRYPTION_KEY
        sync: false
      - key: GOOGLE_CALENDAR_REDIRECT_URI
        value: https://agenda-unb-api-homolog.onrender.com/api/v1/me/google-calendar/callback
      - key: GOOGLE_CALENDAR_FRONTEND_REDIRECT_URI
        value: https://agendaunb.com.br/eventos?aba=meus
      - key: GEMINI_API_KEY
        sync: false
      - key: GEMINI_MODEL
        value: gemini-3.5-flash-lite
      - key: SYLLABUS_WORKER_ENABLED
        value: "true"
      - key: SYLLABUS_PRIVACY_READY
        value: "true"
      - key: SYLLABUS_PROVIDER_TERMS_READY
        value: "true"
      - key: SYLLABUS_AI_TIMEOUT_SECONDS
        value: "25"
      - key: SYLLABUS_ATTEMPT_TIMEOUT_SECONDS
        value: "35"
      - key: SYLLABUS_MAX_ATTEMPTS
        value: "3"
      - key: SYLLABUS_RETRY_DELAY_SECONDS
        value: "4"
      - key: SYLLABUS_RATE_LIMIT_DELAY_SECONDS
        value: "65"
      - key: SYLLABUS_MIN_INTERVAL_SECONDS
        value: "4.0"
      - key: SYLLABUS_MAX_FILE_COST_USD
        value: "0.12"
